name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Keystore de release (si hay secret)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin keystore de release: el APK se firma con la clave debug (no permite actualizar instalaciones existentes)."
          fi

      - name: Compilar APK release + tests
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Renombrar APKs
        run: |
          D=app/build/outputs/apk/release
          REF="${GITHUB_REF_NAME//\//-}"
          # Con splits ABI + universal, AGP genera app-universal-release.apk
          # (ya NO existe app-release.apk): ese era el fallo del workflow.
          mv "$D/app-universal-release.apk" "SiteHub-${REF}.apk"
          mv "$D/app-arm64-v8a-release.apk" "SiteHub-${REF}-arm64.apk"
          ls -la SiteHub-*.apk

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SiteHub-APK
          path: SiteHub-*.apk

      - name: Publicar Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SiteHub-*.apk
          generate_release_notes: true
