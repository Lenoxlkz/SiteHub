name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK release + tests
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Renombrar APKs
        run: |
          D=app/build/outputs/apk/release
          mv $D/app-release.apk SiteHub-${GITHUB_REF_NAME}.apk
          if [ -f $D/app-arm64-v8a-release.apk ]; then
            mv $D/app-arm64-v8a-release.apk SiteHub-${GITHUB_REF_NAME}-arm64.apk
          fi
          ls -la SiteHub-*.apk

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SiteHub-APK
          path: SiteHub-*.apk

      - name: Publicar Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SiteHub-*.apk
          generate_release_notes: true
